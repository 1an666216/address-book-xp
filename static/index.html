<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通讯录 · Address Book</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6feb'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Segoe UI,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EAB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">AB</div>
    <div>
      <h1>通讯录</h1>
      <p class="sub">EE308FZ · Extreme Programming</p>
    </div>
  </div>

  <div class="search">
    <input id="search" type="search" placeholder="搜索姓名、电话、邮箱、地址…" autocomplete="off">
  </div>

  <div class="actions">
    <button id="btn-fav" class="btn ghost" title="只看收藏">
      <span class="star">★</span> 只看收藏
    </button>
    <button id="btn-export" class="btn ghost">导出 Excel</button>
    <label class="btn ghost" for="file-input">导入 Excel</label>
    <input id="file-input" type="file" accept=".xlsx" hidden>
    <button id="btn-new" class="btn primary">+ 新建联系人</button>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="stats">
      <div><strong id="stat-total">0</strong><span>联系人</span></div>
      <div><strong id="stat-fav">0</strong><span>收藏</span></div>
      <div><strong id="stat-methods">0</strong><span>联系方式</span></div>
    </div>
    <ul id="contact-list" class="contact-list"></ul>
    <p id="empty-hint" class="empty-hint">还没有联系人，点右上角“新建联系人”开始吧。</p>
  </aside>

  <section id="detail" class="detail">
    <div class="detail-empty">
      <div class="big">👤</div>
      <h2>选择左侧联系人查看详情</h2>
      <p>支持收藏标记、多种联系方式、Excel 导入导出。</p>
    </div>
  </section>
</main>

<!-- create / edit dialog -->
<dialog id="editor" class="editor">
  <form method="dialog" id="editor-form">
    <header class="editor-head">
      <h2 id="editor-title">新建联系人</h2>
      <button type="button" class="icon-btn" data-close aria-label="关闭">✕</button>
    </header>

    <div class="field">
      <label for="f-name">姓名 <em>*</em></label>
      <input id="f-name" required maxlength="40" placeholder="例如：张三">
    </div>

    <label class="switch">
      <input type="checkbox" id="f-fav">
      <span class="slider"></span>
      <span class="switch-label">收藏该联系人（★）</span>
    </label>

    <div class="field">
      <label>联系方式 <span class="hint">可添加多条：手机 / 邮箱 / 微信 / QQ / 地址 …</span></label>
      <div id="method-rows" class="method-rows"></div>
      <button type="button" class="btn ghost small" id="btn-add-method">+ 添加一项联系方式</button>
    </div>

    <div class="field">
      <label for="f-note">备注</label>
      <textarea id="f-note" rows="2" maxlength="200" placeholder="可选，例如：大学室友"></textarea>
    </div>

    <footer class="editor-foot">
      <button type="button" class="btn ghost" data-close>取消</button>
      <button type="submit" class="btn primary" id="btn-save">保存</button>
    </footer>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<template id="method-row-template">
  <div class="method-row">
    <select class="m-type">
      <option value="phone">手机</option>
      <option value="email">邮箱</option>
      <option value="wechat">微信</option>
      <option value="qq">QQ</option>
      <option value="address">地址</option>
      <option value="other">其他</option>
    </select>
    <input class="m-value" placeholder="填写内容" maxlength="120">
    <button type="button" class="icon-btn danger" title="删除这一项">✕</button>
  </div>
</template>

<script src="/app.js"></script>
</body>
</html>
